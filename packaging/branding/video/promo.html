<!doctype html>
<!-- Fonyx launch film, ~81 s. Every frame is a function of time: await prep(t), then render(t).
     ?v renders the 9:16 cut. cues.js is the clock (shared with music.py); timing.js (vo.py) has the
     narration's line times. The app is never drawn: footage/<take>/ holds the real UI, filmed by
     capture.mjs in an isolated session, and this page only frames it, zooms on it and annotates it. -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'SG'; src: url('fonts/space-grotesk.woff2') format('woff2'); font-weight: 300 700; }
  @font-face { font-family: 'Inter'; src: url('fonts/inter.woff2') format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'Mono'; src: url('../../../site/node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2') format('woff2'); font-weight: 100 800; }
  html, body { margin: 0; background: #080B0F; overflow: hidden; }
</style>
<script src="cues.js"></script>
<script src="timing.js"></script>
<script src="footage/cli.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<script>
const V = location.search.includes('v');
const W = V ? 1080 : 1920, H = V ? 1920 : 1080, L = (h, v) => V ? v : h;
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
canvas.width = W; canvas.height = H;
const fx = new OffscreenCanvas(W, H), fctx = fx.getContext('2d');           // fire layer, added on top
const bloom = new OffscreenCanvas(W / 4, H / 4), bctx = bloom.getContext('2d');

// palette (the brief's), plus the logo's own colours, which never change
const OBS = '#080B0F', TEAL = '#0B1F24', SURF = '#102D32', CYAN = '#36E4F4', CYAN2 = '#83F5FF', AMBER = '#FFB454',
  ORANGE = '#FF6B35', TXT = '#F3F7FA', TXT2 = '#A6B6C0', BORDER = '#25434A', GREEN = '#53E6A0';
const LOGO = { red: '#cf4027', amber: '#f0a63c', bone: '#efe7d5', ink: '#0e2a31' };

const CU = window.CUES, S = CU.scenes, PH = CU.phoenix, PR = CU.problem, TK = CU.takes;
const TIMING = window.TIMING || { lines: [] };
const line = id => TIMING.lines.find(l => l.id === id) || { t0: 0, t1: 0 };
const speaking = (t, ids) => TIMING.lines.filter(l => !ids || ids.includes(l.id))
  .reduce((m, l) => Math.max(m, ease(t, l.t0 - 0.05, l.t0 + 0.08) * (1 - ease(t, l.t1, l.t1 + 0.25))), 0);

const clamp = x => Math.min(Math.max(x, 0), 1), mix = (a, b, f) => a + (b - a) * f;
const ease = (t, a, b) => { const x = clamp((t - a) / (b - a)); return x * x * (3 - 2 * x); };
const out3 = x => 1 - (1 - clamp(x)) ** 3;
const vis = (t, a, b, f = 0.4) => ease(t, a, a + f) * (1 - ease(t, b - f, b));
const hash = n => { const x = Math.sin(n * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); };
const nz = (i, t) => 0.5 + 0.25 * Math.sin(t * 3.1 + i * 1.7) + 0.25 * Math.sin(t * 5.3 + i * 0.83 + Math.sin(i * 2.1));
const hex = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
const lerpC = (a, b, f) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(mix(v, B[i], f))).join(',')})`; };
const rgba = (c, a) => `rgba(${hex(c).join(',')},${a})`;
const BEAT = 60 / CU.bpm;
const pulse = t => t < S.fonyx ? 0 : Math.exp(-((t - S.fonyx) % BEAT) / 0.15);

// ---------- footage: frames are loaded by prep(t) before each render ----------
const FPS = 30, DPR = 1.5;   // footage px per app CSS px
const TAKE_N = {}, frames = new Map();
const takeLog = {};
const takeIdx = (k, t) => Math.min(TAKE_N[k] - 1, Math.max(0, Math.round((t - TK[k]) * FPS)));
const WINDOWS = { home: [21.4, S.groups + 0.7], groups: [S.groups - 0.6, S.faders + 0.7], faders: [S.faders - 0.6, S.routing + 0.7], routing: [S.routing - 0.6, S.eq + 0.7],
  eq: [S.eq - 0.6, S.duck + 0.7], duck: [S.duck - 0.6, S.tour + 0.4], features: [S.tour - 0.6, S.outro] };
const loadFrame = key => new Promise(r => { const i = new Image(); i.onload = () => i.decode().then(() => r(i)); i.onerror = () => r(null); i.src = `footage/${key}.jpg`; });
window.prep = async t => {
  const want = Object.entries(WINDOWS).filter(([, [a, b]]) => t >= a && t <= b).map(([k]) => `${k}/${String(takeIdx(k, t)).padStart(4, '0')}`);
  await Promise.all(want.filter(k => !frames.has(k)).map(async k => frames.set(k, await loadFrame(k))));
  for (const k of frames.keys()) if (!want.includes(k)) frames.delete(k);   // frames only ever move forward
};
const frame = (k, t) => frames.get(`${k}/${String(takeIdx(k, t)).padStart(4, '0')}`);

// soft sprites for fire, and film grain
const sprite = (c0, c1) => { const s = new OffscreenCanvas(64, 64), g = s.getContext('2d'), r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  r.addColorStop(0, c0); r.addColorStop(0.35, c1); r.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = r; g.fillRect(0, 0, 64, 64); return s; };
const SPR = [sprite('rgba(255,236,210,1)', 'rgba(255,190,120,0.6)'), sprite('rgba(255,180,84,1)', 'rgba(255,107,53,0.5)'),
  sprite('rgba(255,107,53,0.9)', 'rgba(207,64,39,0.4)'), sprite('rgba(180,50,25,0.7)', 'rgba(100,25,15,0.25)'),
  sprite('rgba(220,252,255,1)', 'rgba(54,228,244,0.55)')];
const GRAIN = Array.from({ length: 4 }, (_, k) => { const s = new OffscreenCanvas(256, 256), g = s.getContext('2d'), d = g.createImageData(256, 256);
  for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (hash(i * 0.37 + k * 999) - 0.5) * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  g.putImageData(d, 0, 0); return s; });
const GITHUB = new Path2D('M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12');

window.ready = Promise.all([
  ...['700 10px SG', '500 10px SG', '400 10px Inter', '500 10px Inter', '600 10px Inter', '500 10px Mono', '600 10px Mono'].map(f => document.fonts.load(f)),
  ...Object.keys(WINDOWS).map(async k => {
    const log = await new Promise(r => { const s = document.createElement('script'); s.src = `footage/${k}.js`; s.onload = () => r(window.TAKE[k]); s.onerror = () => r(null); document.head.appendChild(s); });
    takeLog[k] = log || { events: [], rects: {}, seconds: 10 }; TAKE_N[k] = Math.round(takeLog[k].seconds * FPS);
    const z = takeLog[k].zoom || 1;   // rects are logged in the capture's viewport px; the page works in the app's CSS px
    for (const r in takeLog[k].rects) takeLog[k].rects[r] = takeLog[k].rects[r]?.map(v => v / z);
  }),
]);
const ev = (k, kind) => (takeLog[k].events.find(e => e.kind === kind)?.t ?? 0) + TK[k];

// ---------- type ----------
function text(s, x, y, font, color, alpha = 1, align = 'center', spacing = '0px') {
  if (alpha <= 0.002) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align;
  ctx.letterSpacing = spacing; ctx.fillText(s, x, y); ctx.restore();
}
function measure(s, font, spacing = '0px') { ctx.save(); ctx.font = font; ctx.letterSpacing = spacing; const w = ctx.measureText(s).width; ctx.restore(); return w; }
function wrap(s, font, maxW, spacing = '0px') {
  const words = s.split(' '), lines = [''];
  words.forEach(w => { const c = lines.at(-1) ? lines.at(-1) + ' ' + w : w; if (lines.at(-1) && measure(c.replace(/\*/g, ''), font, spacing) > maxW) lines.push(w); else lines[lines.length - 1] = c; });
  if (lines.length === 2) {   // balance two lines instead of leaving one word dangling
    let best = null;
    for (let i = 1; i < words.length; i++) {
      const a = words.slice(0, i).join(' '), b = words.slice(i).join(' '), m = Math.max(measure(a.replace(/\*/g, ''), font, spacing), measure(b.replace(/\*/g, ''), font, spacing));
      if (m <= maxW && (!best || m < best[0])) best = [m, a, b];
    }
    if (best) return [best[1], best[2]];
  }
  return lines;
}
// Words rise in one after another. *Starred* words take the scene's accent.
function headline(s, t, a, b, { y = L(150, 330), size = L(72, 84), accent = CYAN, maxW = W - L(240, 120) } = {}) {
  const outF = 1 - ease(t, b - 0.35, b); if (t < a || outF <= 0) return;
  const font = `700 ${size}px SG`, sp = '-1px', lines = wrap(s, font, maxW, sp), lh = size * 1.06, space = measure(' ', font, sp);
  let k = 0, star = false;
  lines.forEach((ln, li) => {
    const words = ln.split(' '), ws = words.map(w => measure(w.replace(/\*/g, ''), font, sp));
    let x = W / 2 - (ws.reduce((p, q) => p + q, 0) + space * (words.length - 1)) / 2;
    words.forEach((w, wi) => {
      if (w.startsWith('*')) star = true;
      const at = a + k++ * 0.06, inn = ease(t, at, at + 0.4);
      text(w.replace(/\*/g, ''), x, y + li * lh + 26 * (1 - inn) - 8 * (1 - outF), font, star ? accent : TXT, inn * outF, 'left', sp);
      if (w.endsWith('*')) star = false;
      x += ws[wi] + space;
    });
  });
}
function kicker(s, t, a, b, y, color = TXT2, x = W / 2, align = 'center') {
  text(s, x, y, '600 20px Mono', color, vis(t, a, b), align, '4px');
}
function rr(x, y, w, h, r, fill, stroke, lw = 2, c = ctx) {
  c.beginPath(); c.roundRect(x, y, w, h, r);
  if (fill) { c.fillStyle = fill; c.fill(); }
  if (stroke) { c.strokeStyle = stroke; c.lineWidth = lw; c.stroke(); }
}
function pill(s, x, y, color, alpha, { font = '600 22px Inter', fill = 'rgba(8,11,15,0.82)', align = 'center', dot = false } = {}) {
  if (alpha <= 0.002) return;
  const w = measure(s, font) + 40 + (dot ? 22 : 0), h = 44, x0 = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.shadowColor = color; ctx.shadowBlur = 16; rr(x0, y - h / 2, w, h, h / 2, fill, color, 2); ctx.restore();
  if (dot) { ctx.save(); ctx.globalAlpha *= alpha; ctx.beginPath(); ctx.arc(x0 + 24, y, 6, 0, 7); ctx.fillStyle = color; ctx.fill(); ctx.restore(); }
  text(s, x0 + w / 2 + (dot ? 11 : 0), y + 8, font, TXT, alpha);
}
function cursor(x, y, alpha = 1, press = 0) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y); ctx.scale(1.6, 1.6);
  if (press > 0) { ctx.beginPath(); ctx.arc(0, 0, 10 + 14 * press, 0, 7); ctx.strokeStyle = rgba(CYAN2, 1 - press); ctx.lineWidth = 2; ctx.stroke(); }
  ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 6; ctx.shadowOffsetY = 2;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 22); ctx.lineTo(6, 16.5); ctx.lineTo(10.5, 26); ctx.lineTo(14.5, 24.2); ctx.lineTo(10, 15); ctx.lineTo(18, 15); ctx.closePath();
  ctx.fillStyle = TXT; ctx.fill(); ctx.shadowColor = 'transparent'; ctx.strokeStyle = OBS; ctx.lineWidth = 1.4; ctx.lineJoin = 'round'; ctx.stroke(); ctx.restore();
}

// ---------- world ----------
function background(t) {
  ctx.fillStyle = OBS; ctx.fillRect(0, 0, W, H);
  const lit = t < S.problem ? ease(t, PH.center + 0.2, PH.logo + 0.6) : 1;
  if (lit <= 0) return;
  const outro = ease(t, S.outro, S.outro + 1.2) * (1 - ease(t, S.end - 0.6, S.end));
  ctx.save(); ctx.globalAlpha = lit;
  const g = ctx.createRadialGradient(W * 0.5, H * 0.4, 30, W * 0.5, H * 0.5, Math.max(W, H) * 0.7);
  g.addColorStop(0, lerpC(SURF, '#15434b', outro)); g.addColorStop(0.5, TEAL); g.addColorStop(1, OBS);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // a faint grid, like a mixer's scale, drifting
  ctx.strokeStyle = rgba(CYAN, 0.035); ctx.lineWidth = 1;
  const off = (t * 12) % 60;
  for (let x = -60 + off; x < W + 60; x += 60) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = -60 + off * 0.5; y < H + 60; y += 60) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  if (outro > 0) {   // the finale is the most colourful moment: cyan and amber light behind the logo
    [[CYAN, 0.32, 0.36, 0.5], [AMBER, 0.7, 0.62, 0.35], [CYAN2, 0.2, 0.75, 0.25]].forEach(([c, fx_, fy, a], i) => {
      const x = W * (fx_ + 0.04 * Math.sin(t * 0.6 + i)), y = H * (fy + 0.03 * Math.cos(t * 0.5 + i)), r = Math.max(W, H) * 0.45;
      const gg = ctx.createRadialGradient(x, y, 0, x, y, r); gg.addColorStop(0, rgba(c, 0.16 * a * outro * 2)); gg.addColorStop(1, rgba(c, 0));
      ctx.fillStyle = gg; ctx.fillRect(0, 0, W, H);
    });
  }
  ctx.restore();
}
function finish(t) {
  const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.45, W / 2, H / 2, Math.max(W, H) * 0.75);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = 0.06;
  const f = Math.floor(t * 30);
  ctx.fillStyle = ctx.createPattern(GRAIN[f % 4], 'repeat'); ctx.translate(-(f * 37) % 256, -(f * 91) % 256);
  ctx.fillRect(0, 0, W + 256, H + 256); ctx.restore();
}

// ---------- the logo's bird, as parts, so it can burn and be rebuilt ----------
const WING = [[75, 80, 38, 140, LOGO.red, -15, 94, 220], [125, 148, 38, 116, LOGO.amber, -10, 144, 264], [175, 224, 38, 84, LOGO.bone, -5, 194, 308]];
const TAIL = [[242, 384, 28, 60, LOGO.amber, -30, 256, 356], [242, 384, 28, 84, LOGO.red, 0, 256, 356], [242, 384, 28, 60, LOGO.amber, 30, 256, 356]];
const CREST = [[249, 60, 14, 40, LOGO.amber, -70, 256, 142], [249, 42, 14, 58, LOGO.red, -44, 256, 142], [249, 56, 14, 44, LOGO.amber, -18, 256, 142]];
const rot = (m, cx, cy, rad) => m.translate(cx, cy).rotate(rad * 180 / Math.PI).translate(-cx, -cy);
function birdParts(flap, tilt) {
  const parts = [];
  for (const mir of [false, true]) {
    const m0 = mir ? new DOMMatrix().translate(512, 0).scale(-1, 1) : new DOMMatrix();
    WING.forEach((b, i) => parts.push([b, rot(rot(m0, 236, 250, flap * (1.3 - i * 0.25)), b[6], b[7], b[5] * Math.PI / 180)]));
  }
  const mt = rot(new DOMMatrix(), 256, 356, -tilt * 0.6 + flap * 0.15);
  TAIL.forEach(b => parts.push([b, rot(mt, b[6], b[7], b[5] * Math.PI / 180)]));
  CREST.forEach(b => parts.push([b, rot(new DOMMatrix(), b[6], b[7], b[5] * Math.PI / 180)]));
  parts.push([[228, 150, 56, 212, LOGO.bone, 0, 0, 0], new DOMMatrix()]);
  return parts;
}
const birdBase = (x, y, size, tilt) => new DOMMatrix().translate(x, y).rotate(tilt * 180 / Math.PI).scale(size / 512).translate(-256, -256);
// grow(i) 0..1 raises part i like a level meter, from the end nearest the body; heat 1 = burning
function drawBird(c, x, y, size, flap, tilt, heat, alpha = 1, grow = () => 1, head = 1) {
  const base = birdBase(x, y, size, tilt), hot = col => lerpC(col, '#ffb05a', heat * 0.75);
  c.save(); c.globalAlpha = alpha;
  birdParts(flap, tilt).forEach(([[bx, by, bw, bh, col], m], i) => {
    const g = grow(i); if (g <= 0) return;
    c.setTransform(base.multiply(m)); c.beginPath(); c.roundRect(bx, by + bh * (1 - g), bw, bh * g, bw / 2); c.fillStyle = hot(col); c.fill();
  });
  if (head > 0) {
    c.setTransform(base); c.globalAlpha = alpha * head;
    c.beginPath(); c.moveTo(284, 128); c.lineTo(330, 152); c.lineTo(282, 162); c.closePath();
    c.fillStyle = c.strokeStyle = hot(LOGO.amber); c.lineWidth = 6; c.lineJoin = 'round'; c.fill(); c.stroke();
    c.beginPath(); c.arc(256, 142, 38, 0, 7); c.fillStyle = hot(LOGO.bone); c.fill();
    if (heat < 0.6) { c.beginPath(); c.arc(270, 135, 6.5, 0, 7); c.fillStyle = LOGO.ink; c.fill(); }
  }
  c.restore();
}
function fire(t, x, y, size, flap, tilt, heat, vx, vy) {
  if (heat <= 0.01) return;
  const base = birdBase(x, y, size, tilt);
  fctx.save(); fctx.globalCompositeOperation = 'lighter';
  birdParts(flap, tilt).forEach(([[bx, by, bw, bh], m], p) => {
    const M = base.multiply(m), n = Math.round(bh / 2.6);
    for (let j = 0; j < n; j++) {
      const h1 = hash(p * 131 + j), h2 = hash(p * 71 + j * 3 + 7), h3 = hash(p * 17 + j * 11 + 3), h4 = hash(j * 5 + p * 211);
      const life = 0.28 + 0.4 * h1, age = ((t + h2 * 7) / life) % 1;
      const pt = M.transformPoint(new DOMPoint(bx + bw / 2 + (h4 - 0.5) * bw * 0.9, by + bh * Math.pow(h3, 1.6)));
      const sec = age * life;
      const px = pt.x - vx * sec * 0.55 + Math.sin(t * 7 + j + p) * size * 0.02 * age;
      const py = pt.y - vy * sec * 0.55 - size * 0.85 * sec;
      const r = size * (0.045 + 0.05 * hash(j + p * 3.3)) * Math.pow(1 - age, 0.6) * (0.5 + 0.5 * heat);
      fctx.globalAlpha = heat * Math.pow(1 - age, 1.3) * 0.5;
      fctx.drawImage(SPR[Math.min(3, Math.floor(age * 3.2) + (h1 < 0.12 ? 0 : 1))], px - r, py - r, r * 2, r * 2);
    }
  });
  fctx.restore();
}
function embers(t, cx, cy, size, from, to, burst, seed = 0, cool = 0) {
  fctx.save(); fctx.globalCompositeOperation = 'lighter';
  for (let k = 0; k < 110; k++) {
    const h1 = hash(k + seed), h2 = hash(k * 3.7 + seed), life = 0.9 + 1.2 * h1, born = from + h2 * (to - from), age = (t - born) / life;
    if (age < 0 || age > 1) continue;
    const ang = hash(k * 9.1) * Math.PI * 2, sp = size * (0.3 + 1.6 * hash(k * 5.3)) * burst + size * 0.25;
    const px = cx + Math.cos(ang) * sp * age + Math.sin(t * 3 + k) * 8, py = cy + Math.sin(ang) * sp * age * 0.7 - size * 0.9 * age * age;
    const r = 2 + 4 * hash(k * 2.1);
    fctx.globalAlpha = (1 - age) * 0.9; fctx.drawImage(SPR[hash(k + 3) < cool ? 4 : k % 3 ? 1 : 0], px - r * 3, py - r * 3, r * 6, r * 6);
  }
  fctx.restore();
}
function logoTile(c, x, y, size, alpha) {
  if (alpha <= 0) return;
  const r = c.createRadialGradient(x + size * 0.1, y - size * 0.08, 0, x, y, size * 0.8);
  r.addColorStop(0, '#2b6a76'); r.addColorStop(0.45, '#17414a'); r.addColorStop(1, '#0e2a31');
  c.save(); c.globalAlpha = alpha; c.shadowColor = rgba(CYAN, 0.25); c.shadowBlur = 50;
  rr(x - size / 2, y - size / 2, size, size, size * 116 / 512, r, null, 0, c); c.restore();
}
// a light that runs around the tile's edge
function edgeRun(x, y, size, at, dur, color, width = 4) {
  const k = (at) / dur; if (k <= 0 || k >= 1.2) return;
  const s = size, r = s * 116 / 512, per = 4 * (s - 2 * r) + 2 * Math.PI * r, seg = per * 0.22;
  ctx.save(); ctx.beginPath(); ctx.roundRect(x - s / 2, y - s / 2, s, s, r);
  ctx.setLineDash([seg, per]); ctx.lineDashOffset = -per * k; ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round';
  ctx.shadowColor = color; ctx.shadowBlur = 24; ctx.globalAlpha = Math.min(1, (1.2 - k) * 4); ctx.stroke(); ctx.restore();
}
function logoMark(x, y, size, alpha = 1) { logoTile(ctx, x, y, size, alpha); drawBird(ctx, x, y, size, 0, 0, 0, alpha); }

// ---------- 1. the phoenix becomes the logo (0 - 8) ----------

  const [px, py, pw, ph] = V ? [40, 500, 1000, 760] : [250, 260, 1420, 600], fs = L(22, 25), lh = fs * 1.45;
  ctx.save(); ctx.globalAlpha *= a; ctx.translate(0, 30 * (1 - a)); ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 60;
  rr(px, py, pw, ph, 16, '#06080b', rgba(TXT, 0.12), 1.5); ctx.shadowColor = 'transparent';
  rr(px, py, pw, 44, [16, 16, 0, 0], '#13161a');
  [0, 1, 2].forEach(i => { ctx.beginPath(); ctx.arc(px + 26 + i * 24, py + 22, 7, 0, 7); ctx.fillStyle = ['#e5534b', '#d6a03a', '#4cbf62'][i]; ctx.fill(); });
  ctx.font = '500 18px Mono'; ctx.fillStyle = TXT2; ctx.textAlign = 'center'; ctx.fillText('~ fonyx', px + pw / 2, py + 28); ctx.restore();
  let at = S.cli + 0.35, yy = py + 44 + 46;
  for (const r of runs) {
    if (t < at - 0.15) break;   // a prompt appears when its command is about to be typed
    const n = Math.floor(clamp((t - at) * 36 / r.cmd.length) * r.cmd.length), typing = n < r.cmd.length;
    text('$', px + 28, yy, `600 ${fs}px Mono`, GREEN, a, 'left');
    text(r.cmd.slice(0, n) + (typing && t >= at && Math.floor(t * 4) % 2 ? '▍' : ''), px + 28 + fs * 1.2, yy, `500 ${fs}px Mono`, TXT, a, 'left');
    at += r.cmd.length / 36 + 0.15; yy += lh;
    r.out.split('\n').forEach((ln, i) => { text(ln, px + 28, yy, `500 ${fs}px Mono`, i === 0 && r.out.includes('\n') ? TXT2 : CYAN2, a * ease(t, at + i * 0.04, at + i * 0.04 + 0.1), 'left'); yy += lh; });
    at += 0.35; yy += lh * 0.4;
  }
}

// ---------- 5. open source, short: Linux today, Windows and macOS with help, then the repo (80 - 88) ----------
function sceneOpen(t) {
  if (t < S.open - 0.2 || t > S.outro + 0.3) return;
  const O = S.open, a = 1 - ease(t, S.outro - 0.35, S.outro), gh = ease(t, O + 4.4, O + 5.0);   // os1, os2 in vo.py
  headline('BUILT FOR LINUX. *OPEN TO THE WORLD.*', t, O + 0.3, O + 4.6);
  // the app, small, in the middle (the Doctor's live signal flow); the platforms grow out of it
  const ga_ = rc('features', 'graph') || [24, 560, 1550, 400], pa = a * ease(t, O + 0.1, O + 0.8) * (1 - gh);
  appWindow(frame('features', t), ...(V ? [190, 640, 700, 420] : [610, 330, 700, 330]), [ga_[0] + ga_[2] / 2, ga_[1] + ga_[3] / 2 - 40, ga_[2] + 20], pa, { glow: 1 });
  if (pa > 0) {
    const [px, py] = V ? [540, 964] : [960, 588], NODES = [['Linux', 'Available now', GREEN, true], ['Windows', 'Help wanted', AMBER, false], ['macOS', 'Help wanted', AMBER, false]];
    const said = [line('os2').t0 + 1.2, line('os2').t0 + 1.8];   // "...to Windows and macOS"
    NODES.forEach(([name, sub, c, live], i) => {
      const nx = V ? 200 + i * 340 : 560 + i * 400, ny = L(830, 1300), ia = pa * ease(t, O + 0.5 + i * 0.2, O + 1.0 + i * 0.2);
      const call = i > 0 ? Math.max(0, 1 - Math.abs(t - said[i - 1]) / 0.8) : 0;
      ctx.save(); ctx.globalAlpha *= ia; ctx.strokeStyle = c; ctx.lineWidth = 3; ctx.shadowColor = c; ctx.shadowBlur = 16 + 30 * call;
      if (!live) ctx.setLineDash([10, 10]); ctx.lineDashOffset = -t * 30;
      ctx.beginPath(); ctx.moveTo(px, py + L(110, 140)); ctx.bezierCurveTo(px, ny - 120, nx, py + 160, nx, ny - 70); ctx.stroke(); ctx.setLineDash([]);
      rr(nx - 150, ny - 70, 300, 140, 20, live ? rgba(GREEN, 0.1) : 'rgba(8,11,15,0.7)', c, 2.5); ctx.restore();
      text(name, nx, ny - 2, `700 ${L(38, 40)}px SG`, TXT, ia);
      text(sub, nx, ny + 40, `600 ${L(22, 24)}px Inter`, c, ia);
      if (live) text('✓', nx + 118, ny - 34, '700 26px Inter', GREEN, ia);
    });
    text('The Linux backend stays as it is. New platforms are welcome.', W / 2, L(970, 1450), `500 ${L(26, 28)}px Inter`, TXT2, pa * ease(t, O + 1.4, O + 2.0));
  }
  // the repository
  const ga = a * gh;
  if (ga > 0) {
    headline('EXPLORE THE CODE. *BUILD WITH US.*', t, O + 4.6, S.outro - 0.1);
    const cy = L(560, 900), s = L(110, 140) / 24;
    ctx.save(); ctx.globalAlpha *= ga * 0.9; ctx.lineWidth = 4; ctx.lineCap = 'round';   // branches leave main, then merge back
    const gx0 = L(360, 90), gx1 = W - gx0, gy = cy + L(230, 330);
    ctx.strokeStyle = rgba(TXT2, 0.5); ctx.beginPath(); ctx.moveTo(gx0, gy); ctx.lineTo(gx1, gy); ctx.stroke();
    [[0.12, 0.38, GREEN], [0.45, 0.7, CYAN], [0.66, 0.9, AMBER]].forEach(([u0, u1, c], i) => {
      const p = ease(t, O + 4.8 + i * 0.25, O + 5.8 + i * 0.25), xa = mix(gx0, gx1, u0), xb = mix(gx0, gx1, u1), yb = gy - L(70, 80);
      ctx.strokeStyle = c; ctx.beginPath(); ctx.moveTo(xa, gy); ctx.bezierCurveTo(xa + 40, yb, xa + 40, yb, xa + 60, yb);
      ctx.lineTo(mix(xa + 60, xb - 60, p), yb); if (p >= 1) ctx.bezierCurveTo(xb - 20, yb, xb - 20, gy, xb, gy); ctx.stroke();
      [0.3, 0.7].forEach(q => { if (p > q) { ctx.beginPath(); ctx.arc(mix(xa + 60, xb - 60, q), yb, 8, 0, 7); ctx.fillStyle = c; ctx.fill(); } });
      if (p >= 1) { ctx.beginPath(); ctx.arc(xb, gy, 10, 0, 7); ctx.fillStyle = c; ctx.fill(); }
    });
    ctx.restore();
    ctx.save(); ctx.globalAlpha *= ga; ctx.translate(W / 2 - 12 * s, cy - 12 * s - L(30, 40)); ctx.scale(s, s); ctx.fillStyle = TXT; ctx.fill(GITHUB); ctx.restore();
    text('github.com/ArdenDiago/Fonyx', W / 2, cy + L(130, 160), `600 ${L(46, 48)}px Mono`, TXT, ga);
  }
}

// ---------- 6. outro (88 - 94.8) ----------
function sceneOutro(t) {
  if (t < S.outro - 0.1) return;
  const a = ease(t, S.outro + 0.1, S.outro + 0.7) * (1 - ease(t, S.end - 0.5, S.end)), [lx, ly, ls] = V ? [540, 600, 280] : [960, 250, 200];
  const s = ls * (0.9 + 0.1 * out3((t - S.outro) / 0.9));
  // particles converge into the mark and vanish
  fctx.save(); fctx.globalCompositeOperation = 'lighter';
  for (let k = 0; k < 140; k++) {
    const t0 = S.outro + 0.0 + hash(k) * 0.6, f = clamp((t - t0) / 0.8); if (f <= 0 || f >= 1) continue;
    const ang = hash(k * 3.3) * 7, r0 = Math.max(W, H) * (0.35 + 0.3 * hash(k * 5.1)), e = out3(f), r = r0 * (1 - e) + s * 0.2;
    const px = lx + Math.cos(ang + e * 1.2) * r, py = ly + Math.sin(ang + e * 1.2) * r, z = 3 + 5 * (1 - f);
    fctx.globalAlpha = Math.sin(Math.PI * f); fctx.drawImage(SPR[k % 3 ? 4 : 1], px - z * 3, py - z * 3, z * 6, z * 6);
  }
  fctx.restore();
  logoMark(lx, ly, s, a);
  edgeRun(lx, ly, s, (t - S.outro - 0.5) % 2.4, 1.2, CYAN, 5);
  edgeRun(lx, ly, s, (t - S.outro - 1.1) % 2.4, 1.2, AMBER, 4);
  const ring = ((t - S.outro - 0.5) % 2.4) / 1.4;
  if (ring > 0 && ring < 1) { ctx.save(); ctx.globalAlpha = a * 0.5 * (1 - ring); ctx.strokeStyle = AMBER; ctx.lineWidth = 3; ctx.beginPath(); ctx.roundRect(lx - s / 2 - ring * 40, ly - s / 2 - ring * 40, s + ring * 80, s + ring * 80, s * 116 / 512 + ring * 20); ctx.stroke(); ctx.restore(); }
  const na = a * ease(t, S.outro + 0.6, S.outro + 1.1), ny = L(445, 890);
  text('FONYX', W / 2 + 4, ny + 20 * (1 - na), `700 ${L(110, 130)}px SG`, TXT, na, 'center', '8px');
  const ta = a * ease(t, S.outro + 1.0, S.outro + 1.5), tfont = `500 ${L(36, 40)}px SG`;
  const w1 = measure('YOUR AUDIO.', tfont, '6px'), w2 = measure(' YOUR RULES.', tfont, '6px'), tx = W / 2 - (w1 + w2) / 2;
  text('YOUR AUDIO.', tx, ny + L(66, 80), tfont, TXT2, ta, 'left', '6px'); text(' YOUR RULES.', tx + w1, ny + L(66, 80), tfont, CYAN, ta, 'left', '6px');
  // two places to go, and the command
  const CTA = [['COMING SOON', 'the Snap Store', CYAN], ['CONTRIBUTE ON GITHUB', 'github.com/ArdenDiago/Fonyx', AMBER]];
  CTA.forEach(([k, url, c], i) => {
    const ca = a * ease(t, S.outro + 1.4 + i * 0.2, S.outro + 1.9 + i * 0.2);
    const [cx, cy, cw, ch] = V ? [90, 1030 + i * 170, 900, 140] : [i ? 980 : 300, 600, 640, 140];
    ctx.save(); ctx.globalAlpha *= ca; ctx.shadowColor = c; ctx.shadowBlur = 24; rr(cx, cy + 16 * (1 - ca), cw, ch, 22, 'rgba(8,11,15,0.72)', c, 2.5); ctx.restore();
    if (i === 1) { ctx.save(); ctx.globalAlpha *= ca; ctx.translate(cx + 36, cy + 28 + 16 * (1 - ca)); ctx.scale(1.4, 1.4); ctx.fillStyle = TXT; ctx.fill(GITHUB); ctx.restore(); }
    text(k, cx + (i ? 90 : 36), cy + 54 + 16 * (1 - ca), `600 ${L(20, 22)}px Mono`, c, ca, 'left', '3px');
    text(url, cx + 36, cy + 108 + 16 * (1 - ca), `600 ${L(34, 38)}px Inter`, TXT, ca, 'left');
  });
  const ia = a * ease(t, S.outro + 1.9, S.outro + 2.4), [ix, iy, iw] = V ? [90, 1400, 900] : [500, 790, 920];
  ctx.save(); ctx.globalAlpha *= ia; rr(ix, iy, iw, 90, 16, '#06080b', rgba(GREEN, 0.6), 2); ctx.restore();
  const cmd = 'snap install fonyx   # coming soon', n = Math.floor(clamp((t - S.outro - 2.1) * 28 / cmd.length) * cmd.length);
  text('$', ix + 32, iy + 57, `600 ${L(32, 36)}px Mono`, GREEN, ia, 'left');
  text(cmd.slice(0, n) + ((Math.floor(t * 2) % 2 && n === cmd.length) ? '' : '▍'), ix + 70, iy + 57, `500 ${L(32, 36)}px Mono`, TXT, ia, 'left');
  text('LINUX  ·  PIPEWIRE  ·  OPEN SOURCE', W / 2, L(960, 1630), `600 ${L(20, 24)}px Mono`, TXT2, a * ease(t, S.outro + 2.6, S.outro + 3.1), 'center', '5px');
}

// ---------- frame ----------
window.render = t => {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  fctx.setTransform(1, 0, 0, 1, 0, 0); fctx.clearRect(0, 0, W, H);
  background(t);
  scenePhoenix(t);
  sceneProblem(t);
  sceneFonyx(t);
  sceneTour(t);
  sceneCli(t);
  sceneOpen(t);
  sceneOutro(t);
  // the fire layer: a blurred copy for bloom, then the crisp layer, both additive
  if (t < S.problem || t > S.outro - 0.2) {
    bctx.clearRect(0, 0, W / 4, H / 4); bctx.filter = 'blur(6px)'; bctx.drawImage(fx, 0, 0, W / 4, H / 4); bctx.filter = 'none';
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.55; ctx.drawImage(bloom, 0, 0, W, H); ctx.globalAlpha = 1; ctx.drawImage(fx, 0, 0); ctx.restore();
  }
  finish(t);
  const black = Math.max(1 - ease(t, 0, 0.4), ease(t, S.end, S.end + 0.4));
  if (black > 0) { ctx.globalAlpha = black; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
};
