# Snap Store package: https://snapcraft.io/fonyx
# Built and published by .github/workflows/deploy.yml when staging is merged
# into main. That workflow rewrites `version` before building; the value here
# is only used by a local `snapcraft` run.
#
# Classic confinement: Fonyx rewires the whole PipeWire graph (other apps'
# streams, links, devices), which strict confinement does not allow, and only
# classic or devmode snaps can do that; devmode cannot go to stable.
#
# A classic snap runs on the host, so the binaries are left unpatched and use
# the host's own libraries: PipeWire, WirePlumber's wpctl and WebKitGTK 4.1,
# which Fonyx needs anyway. That also means a glibc as new as the build base's
# (2.39, core24): Ubuntu 24.04+, Debian 13, Fedora 40+, Arch.
name: fonyx
base: core24
version: '0.1.0'
summary: Per-application audio mixer and router for PipeWire
description: |
  Fonyx places each application's audio in a group. Every group has its own
  fader, filters, EQ, compressor, gate, plugins and pan, and can be sent to
  one or more output devices.

  Needs a PipeWire session with WirePlumber, and WebKitGTK 4.1 for the window.
license: GPL-3.0-or-later
grade: stable
confinement: classic

apps:
  fonyx:
    command: bin/fonyx
  daemon:
    command: bin/fonyx-daemon
  ui:
    command: bin/fonyx-ui

# Unpatched host-linked binaries are the point (see the top), not a mistake.
lint:
  ignore: [classic, library]

parts:
  fonyx:
    # Not the rust plugin: its rustup snap does not run under the gnome
    # extension's build environment (exit 127), so install Rust directly.
    plugin: nil
    source: .
    override-build: |
      curl --proto '=https' -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
      . "$HOME/.cargo/env"
      cargo build --release --locked -p fonyx-daemon -p fonyx-cli -p fonyx-ui
      install -Dm755 -t "$CRAFT_PART_INSTALL/bin" \
        target/release/fonyx-daemon target/release/fonyx target/release/fonyx-ui
    build-packages:
      - curl
      - clang
      - pkg-config
      - libpipewire-0.3-dev
      - libwebkit2gtk-4.1-dev
      - libssl-dev
      - librsvg2-dev
