<path d="M438 297.0 L464 297.0" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a)"/>
<text x="30" y="354" font-size="11" font-weight="400" fill="#52606d" text-anchor="start">Input spectrum and input peak are measured at the input, before gain.</text>
<text x="30" y="372" font-size="11" font-weight="400" fill="#52606d" text-anchor="start">Output level meters read the signal after the clamp. Every parameter is smoothed over 15 ms.</text>
