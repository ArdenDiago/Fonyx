# Snap Store package: https://snapcraft.io/fonyx
# Built and published by the Snap Store's own build service, which is linked
# to the GitHub repository and builds main on every push. `version: git`
# comes from `git describe`: tag a release vX.Y.Z on main to name it.
#
# Strict confinement. The `pipewire` plug gives full access to the user's
# PipeWire socket, which is all the daemon and wpctl need to see and relink
# other apps' streams. It is privileged: until the store grants auto-connect,
# run `sudo snap connect fonyx:pipewire` once after installing.
#
# snapd's user daemons are still experimental (installing one needs
# `experimental.user-daemons`), so the daemon is a plain app: opening
# fonyx.ui starts it and writes the autostart entry that starts it at every
# login (see `start_snap_daemon` in ui/src-tauri/src/daemon.rs). The ui app
# therefore carries the daemon's plugs and slot too.
name: fonyx
base: core24
version: git
summary: Per-application audio mixer and router for PipeWire
description: |
  Fonyx places each application's audio in a group. Every group has its own
  fader, filters, EQ, compressor, gate, plugins and pan, and can be sent to
  one or more output devices.

  Needs a PipeWire session with WirePlumber.
license: GPL-3.0-or-later
grade: stable
confinement: strict

# Snaps move XDG_RUNTIME_DIR to /run/user/<uid>/snap.fonyx, where there is no
# PipeWire socket; point libpipewire back at the real one. The other three
# make libpipewire and wpctl load their modules and config from the snap, not
# from core24, which has none.
environment:
  PIPEWIRE_RUNTIME_DIR: $XDG_RUNTIME_DIR/..
  PIPEWIRE_CONFIG_DIR: $SNAP/usr/share/pipewire
  PIPEWIRE_MODULE_DIR: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pipewire-0.3
  SPA_PLUGIN_DIR: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/spa-0.2
  WIREPLUMBER_MODULE_DIR: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/wireplumber-0.4

slots:
  fonyx-dbus:
    interface: dbus
    bus: session
    name: org.fonyx.Daemon

plugs:
  fonyx-dbus-client:
    interface: dbus
    bus: session
    name: org.fonyx.Daemon

apps:
  daemon:
    command: bin/fonyx-daemon
    autostart: fonyx-daemon.desktop
    slots: [fonyx-dbus]
    # login-session-observe: resume-from-sleep rule trigger; system-observe:
    # CPU/RAM on the Home tab. Both optional: the daemon logs and carries on
    # without them.
    plugs: [pipewire, home, login-session-observe, system-observe]
  fonyx:
    command: bin/fonyx
    plugs: [fonyx-dbus-client, home]
  ui:
    command: bin/fonyx-ui
    extensions: [gnome]
    slots: [fonyx-dbus]
    plugs: [fonyx-dbus-client, home, pipewire, login-session-observe, system-observe]

parts:
  fonyx:
    # Not the rust plugin: its rustup snap does not run under the gnome
    # extension's build environment (exit 127), so install Rust directly.
    plugin: nil
    source: .
    override-build: |
      curl --proto '=https' -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
      . "$HOME/.cargo/env"
      cargo build --release --locked -p fonyx-daemon -p fonyx-cli -p fonyx-ui
      install -Dm755 -t "$CRAFT_PART_INSTALL/bin" \
        target/release/fonyx-daemon target/release/fonyx target/release/fonyx-ui
    build-packages:
      - curl
      - clang
      - pkg-config
      - libpipewire-0.3-dev
      - libwebkit2gtk-4.1-dev
      - libssl-dev
      - librsvg2-dev
    stage-packages:
      - libpipewire-0.3-0t64
      - libpipewire-0.3-common
      - libpipewire-0.3-modules
      - libspa-0.2-modules
      - libwebkit2gtk-4.1-0
      - wireplumber # wpctl, for per-stream and device volume
