[package]
name = "fonyx-ui"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true

[lib]
name = "fonyx_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
zbus = "5"
libc = "0.2"
gtk = "0.18" # already in the tree via tauri; only for the startup error dialog
fonyx-client = { path = "../../client" }
