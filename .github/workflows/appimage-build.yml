# TEMPORARY, remove before merging: builds the AppImage from this branch so it
# can be tested and published by hand. deploy.yml builds it for releases.
name: AppImage build
on:
  push:
    branches: [appimage]
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang pkg-config libpipewire-0.3-dev libwebkit2gtk-4.1-dev libssl-dev librsvg2-dev file
      - uses: Swatinem/rust-cache@v2
      - run: cargo install tauri-cli --version '^2' --locked
      - run: sh packaging/appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: fonyx-appimage
          path: Fonyx-x86_64.AppImage
