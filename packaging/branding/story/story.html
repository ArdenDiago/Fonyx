  :root {

  <h1>Never make<br>the audio<br>thread<br><span>wait.</span></h1>

  <svg id="diagram" xmlns="http://www.w3.org/2000/svg"></svg>

  <div class="note">
    <p>A reader caught this in the comments on my LinkedIn post. <em>Fixed.</em></p>
    <small>Per-app mixer<br>for Linux</small>
  </div>

  <svg class="grain" xmlns="http://www.w3.org/2000/svg">
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .9 0"/></filter>
    <rect width="100%" height="100%" filter="url(#n)"/>
  </svg>
</div>
<script>
// Two timing strips on one shared clock. Every mark is placed by period
// index so the gap, the lock block and the swap sliver line up exactly.
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('diagram');
const C = { bone: '#efe7d5', amber: '#f0a63c', signal: '#cf4027', mist: '#a9c8cc', flare: '#f2856a' };
const M = 88, LABEL = 118, X0 = M + LABEL, X1 = 1080 - M;
const N = 16, P = (X1 - X0) / N;        // buffer periods on the shared clock
const BLOCK = [5, 10];                    // periods the control thread is busy

function el(tag, attrs, parent = svg, text) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text) e.textContent = text;
  parent.appendChild(e);
  return e;
}
const mono = (x, y, s, fill, anchor = 'start', size = 17) =>
  el('text', { x, y, fill, 'text-anchor': anchor, 'font-family': 'Mono', 'font-weight': 500,
    'font-size': size, 'letter-spacing': '0.14em' }, svg, s);

function strip(y, title, caption, after) {
  mono(M, y, title, after ? C.amber : C.mist, 'start', 19);
  mono(X1, y, caption, C.mist, 'end');

  const main = y + 58, audio = y + 138;
  mono(M, main + 6, 'CONTROL', C.mist);
  mono(M, audio + 6, 'AUDIO', C.mist);

  // the clock: a tick at every period boundary, through both lanes
  for (let i = 0; i <= N; i++) {
    const x = X0 + i * P;
    el('line', { x1: x, x2: x, y1: main - 30, y2: audio + 44, stroke: C.mist,
      'stroke-opacity': i % 4 ? .13 : .3, 'stroke-width': 1 });
  }
  el('line', { x1: X0, x2: X1, y1: audio + 44, y2: audio + 44, stroke: C.mist, 'stroke-opacity': .3 });

  const bx = X0 + BLOCK[0] * P, bw = (BLOCK[1] - BLOCK[0]) * P;
  if (!after) {
    el('rect', { x: bx + 3, y: main - 18, width: bw - 6, height: 36, rx: 18, fill: C.signal });
    el('text', { x: bx + bw / 2, y: main + 6, fill: C.bone, 'text-anchor': 'middle', 'font-family': 'Mono',
      'font-weight': 700, 'font-size': 16, 'letter-spacing': '0.12em' }, svg, 'LOCK HELD');
  } else {
    el('rect', { x: bx + 3, y: main - 18, width: bw - 6, height: 36, rx: 18, fill: 'none',
      stroke: C.bone, 'stroke-opacity': .55, 'stroke-width': 2, 'stroke-dasharray': '2 7', 'stroke-linecap': 'round' });
    el('text', { x: bx + bw / 2 - 6, y: main + 6, fill: C.bone, 'fill-opacity': .8, 'text-anchor': 'middle',
      'font-family': 'Mono', 'font-weight': 500, 'font-size': 16, 'letter-spacing': '0.12em' }, svg, 'BUILD');
    el('rect', { x: bx + bw - 12, y: main - 22, width: 9, height: 44, rx: 4.5, fill: C.amber });
  }

  // one bar per buffer the audio thread delivers
  const bwBar = 15;
  for (let i = 0; i < N; i++) {
    const x = X0 + i * P + P / 2 - bwBar / 2;
    const stalled = !after && i >= BLOCK[0] && i < BLOCK[1];
    if (stalled) continue;
    el('rect', { x, y: audio - 30, width: bwBar, height: 60, rx: bwBar / 2,
      fill: after && i === BLOCK[1] - 1 ? C.amber : C.bone });
  }
  if (!after) {
    // the dropout: a flat, red line where the bars should have been
    el('line', { x1: bx + P / 2 - 7, x2: bx + bw - P / 2 + 7, y1: audio, y2: audio,
      stroke: C.signal, 'stroke-width': 3, 'stroke-linecap': 'round', 'stroke-dasharray': '1 10' });
    mono(bx + bw / 2, audio + 74, 'DROPOUT', C.flare, 'middle');
  } else {
    mono(bx + bw - P / 2, audio + 74, 'SWAP', C.amber, 'middle');
  }
}

strip(0, 'BEFORE', 'CHAIN BUILT UNDER THE LOCK', false);
strip(268, 'AFTER', 'BUILT OUTSIDE · SWAPPED IN', true);
</script>
</body>
