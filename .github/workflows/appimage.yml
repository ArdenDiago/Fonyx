# Builds the AppImage and publishes it as a GitHub release whenever a merge
# into main changes the application itself (daemon, CLI, desktop app, or the
# build). Docs, the website and branding changes publish nothing.
#
# Each release takes the next patch version after the newest vX.Y.Z tag and
# tags that commit. The website and README link to
# releases/latest/download/Fonyx-x86_64.AppImage, which always points at the
# newest one. "Run workflow" on the Actions tab publishes one by hand.
name: AppImage

on:
  push:
    branches: [main]
    paths:
      - 'daemon/**'
      - 'client/**'
      - 'cli/**'
      - 'ui/index.html'
      - 'ui/src-tauri/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'packaging/appimage.sh'
      - '.github/workflows/appimage.yml'
  workflow_dispatch:

# One release at a time, never cancelled halfway: two merges in a row each
# get their own version.
concurrency:
  group: appimage
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  appimage:
    name: Build and publish the AppImage
    runs-on: ubuntu-24.04
    # Built on Debian 12, so it runs on that glibc (2.36) or newer (the
    # README's "Debian 12, Ubuntu 23.04, Fedora 37, Arch, or newer"). Built on
    # Ubuntu 24.04 it needed glibc 2.38 and would not start on a user's older
    # system ("version `GLIBC_2.38' not found"). Ubuntu 22.04 is out of reach:
    # its PipeWire 0.3.48 headers are too old for the pipewire crate.
    container: debian:12
    timeout-minutes: 90
    steps:
      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates curl build-essential gh xdg-utils \
            clang pkg-config libpipewire-0.3-dev libwebkit2gtk-4.1-dev libssl-dev librsvg2-dev file

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The container's user differs from the checkout's owner.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2

      - name: Install the Tauri bundler
        run: cargo install tauri-cli --version '^2' --locked

      - name: Build the AppImage
        run: sh packaging/appimage.sh

      - name: Pick the version
        id: version
        run: |
          last=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          v=${last#v}; v=${v:-0.1.0}
          echo "version=${v%.*}.$((${v##*.} + 1))" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" Fonyx-x86_64.AppImage --target "$GITHUB_SHA" --latest \
            --title "Fonyx $VERSION" \
            --notes "Download Fonyx-x86_64.AppImage, then \`chmod +x Fonyx-x86_64.AppImage && ./Fonyx-x86_64.AppImage\`. It starts its own mixer and stops it when you close the window. Needs PipeWire with WirePlumber (Debian 12, Ubuntu 23.04, Fedora 37, Arch, or newer). Fonyx is in public beta: if something doesn't work, please report it at https://github.com/ArdenDiago/Fonyx/issues/new/choose. Built from $GITHUB_SHA."
