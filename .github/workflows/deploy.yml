# Runs when a pull request from staging is merged into main: picks the next
# version, builds the snap with it, publishes it to the Snap Store and tags
# the merge commit vX.Y.Z. A merge that changes nothing in the snap since
# the last tag (only docs/, packaging/branding/ or top-level Markdown, the
# same list as ci.yml) publishes nothing.
#
# The version lives in git tags, not in a commit. main only takes pull
# requests, and a bot commit on main would also leave staging one commit
# behind, so the next staging -> main pull request would conflict. The
# Cargo.toml, tauri.conf.json and snapcraft.yaml versions are rewritten in
# the build checkout only.
#
# It can also be run by hand on main (Actions > Deploy to main > Run
# workflow) to rebuild unchanged code, e.g. when the Snap Store reports
# security updates (USNs) for packages staged in the snap.
#
# Needs the repository secret SNAPCRAFT_STORE_CREDENTIALS, from:
#   snapcraft export-login --snaps=fonyx --channels=edge,stable \
#     --acls package_access,package_push,package_update,package_release -
name: Deploy to main

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write # push the version tag

jobs:
  changes:
    name: Detect code changes
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (
      github.event.pull_request.merged == true &&
      github.head_ref == 'staging' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
      # Against the last release, not the pull request's base: a skipped
      # docs-only merge leaves no tag, so the next release still sees it.
      - id: diff
        run: |
          code=true
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && [ -n "$last" ] && files=$(git diff --name-only "$last" HEAD) &&
             ! printf '%s\n' "$files" | grep -qvE '^(docs/|packaging/branding/|[^/]+\.md$)'; then
            code=false
            echo "Nothing in the snap changed since $last; not publishing."
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to main
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0

      # The first release takes the version in Cargo.toml; after that, the
      # patch number of the last vX.Y.Z tag goes up by one.
      - name: Next version
        id: version
        run: |
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$last" ]; then
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' daemon/Cargo.toml)
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            version="$major.$minor.$((patch + 1))"
          fi
          echo "Releasing $version (last tag: ${last:-none})"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Write the version into the build checkout
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" \
            daemon/Cargo.toml client/Cargo.toml cli/Cargo.toml ui/src-tauri/Cargo.toml
          sed -i "0,/\"version\": \".*\"/s//\"version\": \"$VERSION\"/" ui/src-tauri/tauri.conf.json
          sed -i "s/^version: .*/version: '$VERSION'/" snap/snapcraft.yaml
          # The snap build runs `cargo install --locked`.
          cargo update --workspace
          git diff --stat

      - uses: snapcore/action-build@v1
        id: snap

      - uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.snap.outputs.snap }}
          release: latest/edge,latest/stable

      # Last, so a failed build or upload retries the same version next time.
      - name: Tag the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "v$VERSION" "${{ github.event.pull_request.merge_commit_sha || github.sha }}"
          git push origin "v$VERSION"
