[package]
name = "mtxpanel-daemon"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mtxpanel-daemon"
path = "src/main.rs"

[dependencies]
pipewire = { version = "0.10", features = ["v0_3_49"] }
zbus = "5"
rtrb = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
sysinfo = "0.39.6"
rustfft = "6.4.1"
libc = "0.2"
hound = "3.5"
